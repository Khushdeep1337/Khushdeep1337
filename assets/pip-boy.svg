      <path d="M342 491V535M619 491V535" stroke="#a5ff88" stroke-opacity=".25"/>
      <text x="65" y="554" font-size="11" letter-spacing=".5" fill="#a7c69a">OWN PUBLIC REPOS / DEFAULT BRANCHES</text>
      <text id="stats-updated" x="894" y="554" font-size="11" letter-spacing=".5" fill="#a7c69a" text-anchor="end">SNAPSHOT 2026-11-12</text>
