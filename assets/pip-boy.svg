<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">Pip-Boy 1337 — Khushdeep's personnel file</title>
  <desc id="description">Green phosphor terminal with an illustrated Sikh vault technician wearing a neatly wrapped turban and rectangular glasses, with a short beard. Toolkit labels surround the character: Python, C#, SQL, TypeScript, Docker. Khushdeep, he/him, @Khushdeep1337. GitHub snapshot from 2026-11-12: 98 authored commits and 39,672 lines changed (additions plus deletions) across default branches of owned public non-fork repositories; 15 public repositories overall. Merge and empty commits are excluded. Fun fact: I'm the best Aatrox player in North America.</desc>
  <defs>
    <linearGradient id="case" x2="0.3" y2="1">
      <stop stop-color="#4c5141"/>
      <stop offset=".45" stop-color="#282e25"/>
      <stop offset="1" stop-color="#404536"/>
    </linearGradient>
    <radialGradient id="glass" cx=".44" cy=".4" r=".78">
      <stop stop-color="#203522"/>
      <stop offset=".65" stop-color="#142318"/>
      <stop offset="1" stop-color="#09120e"/>
    </radialGradient>
    <linearGradient id="reflection" x2=".2" y2="1">
      <stop stop-color="#e4ffd1" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#e4ffd1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#000" stroke-opacity=".19"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9cff79" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="31" y="31" width="898" height="538" rx="36"/></clipPath>
  </defs>

  <!-- The bezel is deliberately thin: the screen carries the design. -->
  <rect x="2" y="2" width="956" height="596" rx="53" fill="#131a14"/>
  <rect x="5" y="5" width="950" height="590" rx="50" fill="url(#case)" stroke="#636650" stroke-width="2"/>
  <rect x="19" y="19" width="922" height="562" rx="44" fill="#0b100d" stroke="#161e16" stroke-width="7"/>
  <rect x="31" y="31" width="898" height="538" rx="36" fill="url(#glass)" stroke="#69725a" stroke-opacity=".45"/>
  <g clip-path="url(#screen)">
    <rect x="31" y="31" width="898" height="538" fill="url(#grid)"/>
    <path d="M31 31H929V163Q465 79 31 141Z" fill="url(#reflection)"/>

    <g font-family="Consolas, 'Liberation Mono', monospace" fill="#a5ff88">
      <text x="65" y="66" font-size="12" letter-spacing="2.1" fill="#a7c69a">PERSONAL INFORMATION PROCESSOR</text>
      <text x="894" y="66" font-size="12" letter-spacing="1.6" fill="#a7c69a" text-anchor="end">MODEL / 1337</text>

