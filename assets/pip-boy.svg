      <path d="M65 121H101V88H223V121H894" fill="none" stroke="#8fff71" stroke-width="2"/>
      <text x="162" y="111" font-size="24" font-weight="700" text-anchor="middle" filter="url(#glow)">STAT</text>
      <text x="296" y="111" font-size="24" fill="#a7c69a">INV</text>
      <text x="429" y="111" font-size="24" fill="#a7c69a">DATA</text>
      <text x="592" y="111" font-size="24" fill="#a7c69a">MAP</text>
