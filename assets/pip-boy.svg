          <rect x="104" y="59" width="30" height="19" rx="1.5"/>
          <path d="M99 67Q101 64 104 66M63 63L69 65M134 63L138 61"/>
        </g>
        <path d="M126 165L177 158L187 190L136 197Z" fill="#15351c" stroke="#a5ff89"/>
        <path d="M146 175L140 181L149 185M166 172L174 177L168 183M159 171L155 186" fill="none" stroke="#a5ff89" stroke-width="2.3"/>
        <path d="M131 198L189 190L194 194L137 203Z" fill="#a5ff89"/>
      </g>

      <text x="398" y="208" font-size="13" letter-spacing="2.4" fill="#a7c69a">VAULT DWELLER / DEVELOPER</text>
      <text x="394" y="258" font-size="46" font-weight="700" letter-spacing=".5" filter="url(#glow)">KHUSHDEEP</text>
      <text x="398" y="290" font-size="18">@Khushdeep1337 <tspan fill="#a7c69a">/ HE · HIM</tspan></text>
      <path d="M398 311H891" stroke="#a5ff88" stroke-opacity=".25"/>
      <text x="398" y="342" font-size="13" letter-spacing="2" fill="#a7c69a">AREAS OF INTEREST</text>
      <text x="398" y="372" font-size="19">SOFTWARE ENGINEERING</text>
      <text x="398" y="399" font-size="19">BIOINFORMATICS / NLP</text>
      <text x="398" y="428" font-size="12" letter-spacing="1.5" fill="#a7c69a">FUN FACT</text>
      <text x="398" y="451" font-size="14">I'M THE BEST AATROX PLAYER IN NORTH AMERICA.</text>

      <!-- Contributor statistics from owned public non-fork default branches. -->
      <path d="M65 478H894" stroke="#8fff71" stroke-width="1.5"/>
      <text id="stats-commits" x="203" y="512" font-size="29" font-weight="700" text-anchor="middle">98</text>
      <text x="203" y="534" font-size="13" text-anchor="middle">AUTHORED COMMITS</text>
      <text id="stats-lines" x="480" y="512" font-size="29" font-weight="700" text-anchor="middle">39,672</text>
      <text x="480" y="534" font-size="13" text-anchor="middle">LINES CHANGED</text>
