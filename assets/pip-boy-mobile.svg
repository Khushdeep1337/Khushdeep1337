<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title description">
  <title id="title">Pip-Boy 1337 — Khushdeep's personnel file</title>
  <desc id="description">Mobile green phosphor terminal with an illustrated Sikh vault technician wearing a neatly wrapped turban and rectangular glasses, with a short beard. Toolkit labels surround the character: Python, C#, SQL, TypeScript, Docker. Khushdeep, he/him, @Khushdeep1337. GitHub snapshot from 2026-11-09: 98 authored commits and 39,672 lines changed (additions plus deletions) across default branches of owned public non-fork repositories; 15 public repositories overall. Merge and empty commits are excluded.</desc>
