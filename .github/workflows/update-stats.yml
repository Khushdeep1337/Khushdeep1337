name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * *'

permissions:
  contents: read

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    # Publishing stays opt-in: the owner manages commits in this repository.
    if: github.repository == 'Khushdeep1337/Khushdeep1337' && vars.AUTO_UPDATE_STATS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test the updater
        run: node --test tests/update-stats.test.mjs
      - name: Fetch public activity and update both layouts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-stats.mjs
      - name: Publish generated stats
        run: |
          git add -- README.md assets/pip-boy.svg assets/pip-boy-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile stats'
          git push
